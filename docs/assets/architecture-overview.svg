<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" role="img" aria-labelledby="title description">
  <title id="title">Wulo-X Clinic Recall architecture</title>
  <desc id="description">Signals from patients and clinic systems enter an AI language layer. Model output crosses a clearly marked deterministic safety boundary only as a proposal. Reviewed code verifies identity, consent, policy, booking, and external effects before an approved action, human review, or suppression and audit.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#DCE5E2" stroke-width="1" opacity="0.42"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#15372F" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#32413D"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2F6FED"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#128C78"/>
    </marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#D94F3D"/>
    </marker>
    <style>
      text { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }
      .kicker { font-size: 14px; font-weight: 750; fill: #2F6FED; letter-spacing: 1.6px; }
      .title { font-size: 30px; font-weight: 760; fill: #15201D; }
      .subtitle { font-size: 16px; fill: #53635E; }
      .stage-number { font-size: 13px; font-weight: 800; fill: #FFFFFF; }
      .stage-title { font-size: 15px; font-weight: 780; fill: #24322E; letter-spacing: 0.7px; }
      .card-title { font-size: 18px; font-weight: 750; fill: #17231F; }
      .body { font-size: 15px; fill: #52615D; }
      .small { font-size: 13.5px; fill: #5E6E69; }
      .chip { font-size: 12px; font-weight: 700; }
      .outcome-title { font-size: 16px; font-weight: 760; fill: #17231F; }
      .outcome-copy { font-size: 13px; fill: #5E6E69; }
      .inverse-title { font-size: 17px; font-weight: 750; fill: #FFFFFF; }
      .inverse-copy { font-size: 13.5px; fill: #B9D9D0; }
    </style>
  </defs>

  <rect width="1440" height="860" fill="#F4F7F6"/>
  <rect width="1440" height="860" fill="url(#grid)"/>

  <g transform="translate(52 42)">
    <rect width="42" height="42" rx="11" fill="#17231F"/>
    <path d="M10 12l8 20h6l8-20h-6l-5 13-5-13z" fill="#FFFFFF"/>
    <text x="58" y="15" class="kicker">WULO-X / CLINIC RECALL</text>
    <text x="58" y="54" class="title">From conversation to authorised action</text>
    <text x="58" y="82" class="subtitle">Language stays flexible. Identity, consent, clinical safety, booking and external writes stay deterministic.</text>
  </g>

  <g transform="translate(1062 46)">
    <circle cx="6" cy="6" r="6" fill="#2F6FED"/>
    <text x="20" y="11" class="small">AI language</text>
    <circle cx="128" cy="6" r="6" fill="#128C78"/>
    <text x="142" y="11" class="small">Code authority</text>
    <circle cx="6" cy="34" r="6" fill="#D94F3D"/>
    <text x="20" y="39" class="small">Human decision</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="52" y="166" width="218" height="524" rx="16" fill="#FFFFFF" stroke="#D7E1DE"/>
    <rect x="294" y="166" width="280" height="524" rx="16" fill="#EEF4FF" stroke="#B8CDF8"/>
    <rect x="646" y="166" width="410" height="524" rx="16" fill="#EAF7F3" stroke="#A9D9CD"/>
    <rect x="1098" y="166" width="290" height="524" rx="16" fill="#FFFFFF" stroke="#D7E1DE"/>
  </g>

  <g>
    <circle cx="78" cy="198" r="14" fill="#32413D"/>
    <text x="78" y="203" text-anchor="middle" class="stage-number">1</text>
    <text x="101" y="203" class="stage-title">SIGNALS</text>
    <circle cx="320" cy="198" r="14" fill="#2F6FED"/>
    <text x="320" y="203" text-anchor="middle" class="stage-number">2</text>
    <text x="343" y="203" class="stage-title">LANGUAGE LAYER</text>
    <circle cx="672" cy="198" r="14" fill="#128C78"/>
    <text x="672" y="203" text-anchor="middle" class="stage-number">3</text>
    <text x="695" y="203" class="stage-title">DETERMINISTIC AUTHORITY</text>
    <circle cx="1124" cy="198" r="14" fill="#D94F3D"/>
    <text x="1124" y="203" text-anchor="middle" class="stage-number">4</text>
    <text x="1147" y="203" class="stage-title">OUTCOMES</text>
  </g>

  <g>
    <rect x="74" y="244" width="174" height="138" rx="12" fill="#F8FAF9" stroke="#D7E1DE"/>
    <circle cx="104" cy="278" r="18" fill="#E9F0EE"/>
    <path d="M96 276a8 8 0 0 1 16 0v4a8 8 0 0 1-16 0zm-4 18c2-6 7-9 12-9s10 3 12 9" fill="none" stroke="#32413D" stroke-width="2.2" stroke-linecap="round"/>
    <text x="132" y="283" class="card-title">Patient</text>
    <text x="94" y="318" class="body">SMS replies</text>
    <text x="94" y="342" class="body">Voice calls</text>
    <text x="94" y="366" class="small">Natural language in</text>

    <rect x="74" y="410" width="174" height="138" rx="12" fill="#F8FAF9" stroke="#D7E1DE"/>
    <circle cx="104" cy="444" r="18" fill="#E9F0EE"/>
    <path d="M95 438h18v13H95zm4-5h10v5H99zm-2 21h14" fill="none" stroke="#32413D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="132" y="449" class="card-title">Clinic data</text>
    <text x="94" y="484" class="body">PMS / calendar</text>
    <text x="94" y="508" class="body">CSV import</text>
    <text x="94" y="532" class="small">Appointments in</text>

    <rect x="74" y="582" width="174" height="70" rx="12" fill="#F1F5F4"/>
    <text x="94" y="611" class="small">Consent signal</text>
    <text x="94" y="635" class="small">STOP always wins</text>
  </g>

  <g>
    <rect x="318" y="244" width="232" height="230" rx="14" fill="#FFFFFF" stroke="#8EAFE9"/>
    <circle cx="356" cy="282" r="21" fill="#2F6FED"/>
    <path d="M347 278h18M347 286h12" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    <text x="390" y="288" class="card-title">Recall agent</text>
    <text x="342" y="328" class="body">Interprets the reply</text>
    <text x="342" y="353" class="body">Drafts safe wording</text>
    <text x="342" y="378" class="body">Summarises context</text>
    <rect x="342" y="405" width="74" height="29" rx="14.5" fill="#E4ECFF"/>
    <text x="379" y="424" text-anchor="middle" class="chip" fill="#2F6FED">INTERPRET</text>
    <rect x="424" y="405" width="60" height="29" rx="14.5" fill="#E4ECFF"/>
    <text x="454" y="424" text-anchor="middle" class="chip" fill="#2F6FED">DRAFT</text>
    <rect x="492" y="405" width="34" height="29" rx="14.5" fill="#FCECE9"/>
    <text x="509" y="424" text-anchor="middle" class="chip" fill="#D94F3D">NO</text>
    <text x="342" y="457" class="small">No tools / no direct writes</text>

    <rect x="318" y="508" width="232" height="144" rx="14" fill="#F7F9FF" stroke="#B8CDF8" stroke-dasharray="6 5"/>
    <text x="342" y="541" class="card-title">Release gate</text>
    <text x="342" y="566" class="small">Every prompt change must pass</text>
    <rect x="342" y="590" width="48" height="28" rx="14" fill="#FFFFFF" stroke="#B8CDF8"/>
    <text x="366" y="609" text-anchor="middle" class="chip" fill="#2F6FED">EVAL</text>
    <rect x="398" y="590" width="64" height="28" rx="14" fill="#FFFFFF" stroke="#B8CDF8"/>
    <text x="430" y="609" text-anchor="middle" class="chip" fill="#2F6FED">ASSERT</text>
    <rect x="470" y="590" width="56" height="28" rx="14" fill="#FFFFFF" stroke="#B8CDF8"/>
    <text x="498" y="609" text-anchor="middle" class="chip" fill="#2F6FED">RED TEAM</text>
    <path d="M434 508V487" fill="none" stroke="#2F6FED" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowBlue)"/>
  </g>

  <g>
    <rect x="596" y="222" width="28" height="430" rx="14" fill="#D94F3D"/>
    <text x="610" y="500" text-anchor="middle" class="chip" fill="#FFFFFF" letter-spacing="1.1" transform="rotate(-90 610 500)">DETERMINISTIC SAFETY BOUNDARY</text>
    <rect x="568" y="292" width="84" height="28" rx="14" fill="#17231F"/>
    <text x="610" y="311" text-anchor="middle" class="chip" fill="#FFFFFF">PROPOSAL</text>
  </g>

  <g>
    <rect x="674" y="244" width="354" height="166" rx="14" fill="#FFFFFF" stroke="#7CC8B6"/>
    <text x="700" y="278" class="card-title">Policy engine</text>
    <text x="700" y="303" class="small">Reviewed Python applies every gate</text>
    <rect x="700" y="326" width="142" height="30" rx="8" fill="#E4F5F0"/>
    <circle cx="717" cy="341" r="7" fill="#128C78"/>
    <path d="M713 341l3 3 5-7" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="731" y="346" class="chip" fill="#126C5E">Identity matched</text>
    <rect x="852" y="326" width="150" height="30" rx="8" fill="#E4F5F0"/>
    <circle cx="869" cy="341" r="7" fill="#128C78"/>
    <path d="M865 341l3 3 5-7" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="883" y="346" class="chip" fill="#126C5E">Consent active</text>
    <rect x="700" y="365" width="142" height="30" rx="8" fill="#E4F5F0"/>
    <circle cx="717" cy="380" r="7" fill="#128C78"/>
    <path d="M713 380l3 3 5-7" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="731" y="385" class="chip" fill="#126C5E">Hours + caps</text>
    <rect x="852" y="365" width="150" height="30" rx="8" fill="#FCECE9"/>
    <circle cx="869" cy="380" r="7" fill="#D94F3D"/>
    <path d="M866 377l6 6m0-6l-6 6" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/>
    <text x="883" y="385" class="chip" fill="#A43B2E">Clinical veto</text>

    <rect x="674" y="430" width="168" height="116" rx="14" fill="#FFFFFF" stroke="#7CC8B6"/>
    <text x="698" y="463" class="card-title">Booking engine</text>
    <text x="698" y="490" class="body">Real availability</text>
    <text x="698" y="515" class="small">Unambiguous slots only</text>

    <rect x="860" y="430" width="168" height="116" rx="14" fill="#FFFFFF" stroke="#7CC8B6"/>
    <text x="884" y="463" class="card-title">Durable effects</text>
    <text x="884" y="490" class="body">Reconcile first</text>
    <text x="884" y="515" class="small">Never retry blindly</text>

    <rect x="674" y="570" width="354" height="82" rx="14" fill="#173F36"/>
    <circle cx="706" cy="611" r="16" fill="#2F655A"/>
    <ellipse cx="706" cy="605" rx="8" ry="4" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <path d="M698 605v11c0 2 4 4 8 4s8-2 8-4v-11" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <text x="734" y="607" class="inverse-title">PostgreSQL / row-level security</text>
    <text x="734" y="630" class="inverse-copy">Tenant-scoped state / complete audit trail</text>
  </g>

  <g>
    <rect x="1122" y="244" width="242" height="112" rx="14" fill="#F1FAF7" stroke="#7CC8B6"/>
    <circle cx="1152" cy="278" r="17" fill="#128C78"/>
    <path d="M1144 278l6 6 11-13" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1180" y="283" class="outcome-title">Approved action</text>
    <text x="1144" y="320" class="outcome-copy">Templated send / confirmed slot</text>
    <text x="1144" y="341" class="outcome-copy">ACS / Twilio / PMS write</text>

    <rect x="1122" y="382" width="242" height="112" rx="14" fill="#FFF3F1" stroke="#E59A8F"/>
    <circle cx="1152" cy="416" r="17" fill="#D94F3D"/>
    <path d="M1145 421c1-6 4-9 7-9s6 3 7 9m-12-15a5 5 0 1 1 10 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="1180" y="421" class="outcome-title">Human review</text>
    <text x="1144" y="458" class="outcome-copy">Clinical / urgent / ambiguous</text>
    <text x="1144" y="479" class="outcome-copy">Staff approve, reject or take over</text>

    <rect x="1122" y="520" width="242" height="112" rx="14" fill="#F4F6F5" stroke="#C9D3D0"/>
    <circle cx="1152" cy="554" r="17" fill="#32413D"/>
    <rect x="1146" y="548" width="12" height="12" rx="2" fill="#FFFFFF"/>
    <text x="1180" y="559" class="outcome-title">Suppress + audit</text>
    <text x="1144" y="596" class="outcome-copy">Opt-out / policy block / uncertainty</text>
    <text x="1144" y="617" class="outcome-copy">Stop, record why, contact nobody</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M248 313H318" stroke="#32413D" stroke-width="2.2" marker-end="url(#arrowInk)"/>
    <path d="M248 479H282V382H318" stroke="#32413D" stroke-width="2.2" marker-end="url(#arrowInk)"/>
    <path d="M550 343H600" stroke="#2F6FED" stroke-width="2.8" marker-end="url(#arrowBlue)"/>
    <path d="M620 343H674" stroke="#D94F3D" stroke-width="2.8" marker-end="url(#arrowCoral)"/>
    <path d="M851 410V430" stroke="#128C78" stroke-width="2.2"/>
    <path d="M842 488H860" stroke="#128C78" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
    <path d="M944 546V570" stroke="#128C78" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
    <path d="M1028 488H1076V300H1122" stroke="#128C78" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
    <path d="M1028 337H1080V438H1122" stroke="#D94F3D" stroke-width="2.2" marker-end="url(#arrowCoral)"/>
    <path d="M1028 611H1080V576H1122" stroke="#32413D" stroke-width="2.2" marker-end="url(#arrowInk)"/>
  </g>

  <g>
    <rect x="52" y="728" width="1336" height="82" rx="16" fill="#17231F"/>
    <rect x="72" y="748" width="164" height="42" rx="21" fill="#D94F3D"/>
    <text x="154" y="774" text-anchor="middle" class="chip" fill="#FFFFFF">FAIL-CLOSED DEFAULT</text>
    <text x="264" y="766" class="inverse-title">Uncertain? Stop, record why, and route to clinic staff.</text>
    <text x="264" y="791" class="inverse-copy">Every action is audited / Every clinic is isolated / No model self-authorises</text>
    <text x="1356" y="774" text-anchor="end" class="inverse-copy">wulo-x / pre-1.0</text>
  </g>
</svg>