<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 760" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Wulo-X architecture: patients and clinic systems talk to an AI language plane that can only propose; a deterministic core owns identity, consent, booking, money, and escalation; humans decide edge cases in the control room.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#F59E0B"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34D399"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#60A5FA"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1360" height="760" rx="16" fill="#0B1220"/>

  <!-- Header -->
  <text x="48" y="58" fill="#60A5FA" font-size="13" font-weight="800" letter-spacing="3">WULO-X · CLINIC RECALL</text>
  <text x="48" y="94" fill="#F8FAFC" font-size="25" font-weight="800">AI drafts the language. Deterministic code makes the decisions.</text>
  <text x="48" y="122" fill="#94A3B8" font-size="14">A model can only propose. Booking, consent, money, and escalation run in reviewed code — and humans own the edge cases.</text>

  <!-- Lane 1: patients & clinic systems -->
  <rect x="48" y="170" width="280" height="520" rx="12" fill="#94A3B8" fill-opacity="0.05" stroke="#94A3B8" stroke-opacity="0.18"/>
  <text x="188" y="198" fill="#94A3B8" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">PATIENTS &amp; CLINIC SYSTEMS</text>

  <rect x="72" y="230" width="232" height="120" rx="10" fill="#111C2E" stroke="#64748B" stroke-opacity="0.55"/>
  <text x="188" y="266" fill="#E2E8F0" font-size="17" font-weight="700" text-anchor="middle">Patients</text>
  <text x="188" y="292" fill="#94A3B8" font-size="13" text-anchor="middle">SMS replies · voice calls</text>
  <text x="188" y="314" fill="#94A3B8" font-size="12" text-anchor="middle">consent and STOP always honoured</text>

  <rect x="72" y="520" width="232" height="120" rx="10" fill="#111C2E" stroke="#64748B" stroke-opacity="0.55"/>
  <text x="188" y="556" fill="#E2E8F0" font-size="17" font-weight="700" text-anchor="middle">Clinic data</text>
  <text x="188" y="582" fill="#94A3B8" font-size="13" text-anchor="middle">PMS / calendar / CSV sync</text>
  <text x="188" y="604" fill="#94A3B8" font-size="12" text-anchor="middle">appointments → recall candidates</text>

  <!-- Lane 2: AI language plane -->
  <rect x="360" y="170" width="280" height="520" rx="12" fill="#60A5FA" fill-opacity="0.05" stroke="#3B82F6" stroke-opacity="0.35"/>
  <text x="500" y="198" fill="#60A5FA" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">AI LANGUAGE PLANE</text>

  <rect x="384" y="230" width="232" height="150" rx="10" fill="#111C2E" stroke="#3B82F6" stroke-opacity="0.8"/>
  <text x="500" y="264" fill="#E2E8F0" font-size="17" font-weight="700" text-anchor="middle">Recall &amp; inbound agents</text>
  <text x="500" y="290" fill="#94A3B8" font-size="13" text-anchor="middle">governed prompt-as-code</text>
  <text x="500" y="312" fill="#94A3B8" font-size="13" text-anchor="middle">Azure OpenAI · VoiceLive</text>
  <text x="500" y="352" fill="#60A5FA" font-size="12.5" font-style="italic" font-weight="600" text-anchor="middle">drafts words — decides nothing</text>

  <rect x="384" y="520" width="232" height="120" rx="10" fill="#111C2E" stroke="#3B82F6" stroke-opacity="0.8" stroke-dasharray="5 4"/>
  <text x="500" y="556" fill="#E2E8F0" font-size="16" font-weight="700" text-anchor="middle">AgentOps release gate</text>
  <text x="500" y="582" fill="#94A3B8" font-size="13" text-anchor="middle">eval → ASSERT → red team</text>
  <text x="500" y="604" fill="#94A3B8" font-size="12" text-anchor="middle">no green gate, no ship</text>

  <line x1="500" y1="520" x2="500" y2="388" stroke="#60A5FA" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <text x="510" y="460" fill="#60A5FA" font-size="11.5">gates every prompt change</text>

  <!-- Safety boundary -->
  <line x1="692" y1="170" x2="692" y2="690" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text x="692" y="158" fill="#F59E0B" font-size="11.5" font-weight="800" letter-spacing="2.5" text-anchor="middle">DETERMINISTIC SAFETY BOUNDARY</text>

  <!-- Lane 3: deterministic core & humans -->
  <rect x="724" y="170" width="588" height="520" rx="12" fill="#34D399" fill-opacity="0.04" stroke="#34D399" stroke-opacity="0.3"/>
  <text x="1018" y="198" fill="#34D399" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">DETERMINISTIC CORE &amp; HUMANS</text>

  <rect x="748" y="230" width="280" height="230" rx="10" fill="#111C2E" stroke="#34D399" stroke-opacity="0.8"/>
  <text x="888" y="262" fill="#E2E8F0" font-size="17" font-weight="700" text-anchor="middle">Clinic Recall core</text>
  <text x="888" y="284" fill="#94A3B8" font-size="12.5" text-anchor="middle">FastAPI · src/clinic_recall</text>
  <rect x="772" y="300" width="232" height="26" rx="13" fill="#34D399" fill-opacity="0.1"/>
  <text x="888" y="317" fill="#A7F3D0" font-size="11.5" text-anchor="middle">identity · consent · opt-out</text>
  <rect x="772" y="334" width="232" height="26" rx="13" fill="#34D399" fill-opacity="0.1"/>
  <text x="888" y="351" fill="#A7F3D0" font-size="11.5" text-anchor="middle">eligibility · quiet hours · caps</text>
  <rect x="772" y="368" width="232" height="26" rx="13" fill="#34D399" fill-opacity="0.1"/>
  <text x="888" y="385" fill="#A7F3D0" font-size="11.5" text-anchor="middle">deterministic booking engine</text>
  <rect x="772" y="402" width="232" height="26" rx="13" fill="#34D399" fill-opacity="0.1"/>
  <text x="888" y="419" fill="#A7F3D0" font-size="11.5" text-anchor="middle">durable effects + reconciliation</text>

  <rect x="812" y="520" width="216" height="120" rx="10" fill="#111C2E" stroke="#34D399" stroke-opacity="0.8"/>
  <text x="920" y="556" fill="#E2E8F0" font-size="16" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <text x="920" y="582" fill="#94A3B8" font-size="13" text-anchor="middle">row-level security per clinic</text>
  <text x="920" y="604" fill="#94A3B8" font-size="12" text-anchor="middle">full audit trail</text>

  <rect x="1052" y="230" width="236" height="230" rx="10" fill="#111C2E" stroke="#A78BFA" stroke-opacity="0.8"/>
  <text x="1170" y="264" fill="#E2E8F0" font-size="17" font-weight="700" text-anchor="middle">Clinic control room</text>
  <text x="1170" y="290" fill="#94A3B8" font-size="13" text-anchor="middle">React staff surfaces</text>
  <text x="1170" y="330" fill="#C4B5FD" font-size="12.5" text-anchor="middle">approve / reject bookings</text>
  <text x="1170" y="356" fill="#C4B5FD" font-size="12.5" text-anchor="middle">urgent &amp; clinical escalations</text>
  <text x="1170" y="382" fill="#C4B5FD" font-size="12.5" text-anchor="middle">campaign launch review</text>
  <text x="1170" y="428" fill="#A78BFA" font-size="12.5" font-style="italic" font-weight="600" text-anchor="middle">humans decide the edge cases</text>

  <!-- Flows -->
  <line x1="304" y1="290" x2="384" y2="290" stroke="#64748B" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="344" y="278" fill="#94A3B8" font-size="11.5" text-anchor="middle">conversation</text>

  <line x1="616" y1="300" x2="748" y2="300" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <text x="682" y="288" fill="#F59E0B" font-size="11.5" font-weight="700" text-anchor="middle">intent only — no authority</text>

  <path d="M304 606 L332 606 L332 672 L748 672" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)" stroke-dasharray="3 4"/>
  <text x="540" y="660" fill="#94A3B8" font-size="11.5" text-anchor="middle">deterministic sync</text>

  <path d="M772 460 L772 714 L188 714 L188 350" fill="none" stroke="#34D399" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <text x="480" y="704" fill="#34D399" font-size="11.5" text-anchor="middle">approved sends only — templated SMS · booked slots · via ACS / Twilio</text>

  <line x1="1028" y1="310" x2="1052" y2="310" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="1052" y1="380" x2="1028" y2="380" stroke="#64748B" stroke-width="1.6" marker-end="url(#arr)"/>

  <line x1="906" y1="460" x2="912" y2="520" stroke="#64748B" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Footer -->
  <text x="48" y="744" fill="#64748B" font-size="12">Every action is audited. Uncertain, urgent, or clinical content stops the automation and goes to a human.</text>
</svg>
