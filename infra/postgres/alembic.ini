# Alembic configuration for the Clinic Recall data plane.
#
# Run from the repository root, e.g.:
#   alembic -c infra/postgres/alembic.ini upgrade head
#
# The database URL is resolved in env.py from CLINIC_RECALL_DATABASE_URL or the
# discrete POSTGRES_* variables, so no secret is stored in this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is intentionally blank; env.py supplies it at runtime.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
