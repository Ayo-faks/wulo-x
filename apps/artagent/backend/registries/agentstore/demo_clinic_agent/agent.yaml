name: DemoClinicAgent
description: Public 60-second demo persona for a fictional clinic (no tools, no real data)

handoff:
  trigger: handoff_demo_clinic_agent
  is_entry_point: true

greeting: |
  Hi! This is the Wulo Clinic Recall demo, answering for the fictional Riverside
  Physiotherapy. Ask me anything a patient might ask.

return_greeting: |
  Thanks for staying with me. What else would you like to try?

voice:
  name: en-GB-SoniaNeural
  type: azure-standard
  rate: "-3%"

voicelive_model:
  deployment_id: gpt-realtime
  temperature: 0.2
  max_tokens: 1024

cascade_model:
  deployment_id: gpt-4o-mini
  temperature: 0.2
  max_tokens: 512

session:
  modalities: [TEXT, AUDIO]
  input_audio_format: PCM16
  output_audio_format: PCM16
  input_audio_transcription_settings:
    model: gpt-4o-transcribe
    language: en-GB
  input_audio_echo_cancellation:
    type: server_echo_cancellation
  input_audio_noise_reduction:
    type: azure_deep_noise_suppression
  turn_detection:
    type: azure_semantic_vad
    threshold: 0.5
    prefix_padding_ms: 240
    silence_duration_ms: 550
    interrupt_response: true
    create_response: false
    auto_truncate: true
  tool_choice: none

speech:
  recognition:
    language: en-GB
  synthesis:
    voice_name: en-GB-SoniaNeural
  vad:
    threshold: 0.02
    silence_duration_ms: 700
    prefix_padding_ms: 200

# Deterministic safety: the demo persona has NO tools bound. It cannot book,
# look up, or mutate anything.
tools: []

prompts:
  path: ../../../../../../.agentops/prompts/demo-assistant.prompt.md
